version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: todo-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: Todo@12345
      MYSQL_DATABASE: TodoDb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: todo-backend-api
    ports:
      - "8081:8080"
    environment:
      - DB_CONNECTION_STRING=Server=db;Port=3306;Database=TodoDb;User=root;Password=Todo@12345;
      - JWT_KEY=SuperSecretKeyDevelopment123456789012345
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  frontend:
    build:
      context: ../Todo-Frontend/sql_frontend
      dockerfile: Dockerfile
    container_name: todo-frontend-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mysql_data:
